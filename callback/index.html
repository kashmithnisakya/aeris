<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Returning to Aeris</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: Canvas; color: CanvasText; padding: 16px; box-sizing: border-box; }
  main { text-align: center; max-width: 420px; }
  img { width: 72px; height: 72px; }
  a.button { display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 10px;
             background: #2f7cf6; color: #fff; text-decoration: none; font-weight: 600; }
  p.muted { opacity: .7; font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="https://raw.githubusercontent.com/kashmithnisakya/aeris/assets/icon.png" alt="">
  <h1 id="title">Returning to Aeris…</h1>
  <p id="msg">If your browser asks, allow it to open Aeris.</p>
  <a class="button" id="open" href="#">Open Aeris</a>
  <p class="muted">Then close this tab and click the Aeris icon in your menu bar.</p>
</main>
<script>
  // SmartThings redirects here with ?code=…&state=… (or ?error=…). Hand those to the app
  // through its aeris:// URL scheme. Nothing is stored or sent anywhere else.
  var target = "aeris://oauth/callback" + window.location.search;
  document.getElementById("open").href = target;
  var params = new URLSearchParams(window.location.search);
  if (params.get("error")) {
    document.getElementById("title").textContent = "Sign-in was cancelled";
    document.getElementById("msg").textContent = "Aeris will let you try again.";
  }
  if (params.has("code") || params.has("error")) window.location.replace(target);
  else {
    document.getElementById("title").textContent = "Aeris sign-in";
    document.getElementById("msg").textContent = "Start sign-in from the Aeris menu bar app.";
    document.getElementById("open").style.display = "none";
  }
</script>
</body>
</html>
