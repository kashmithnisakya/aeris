name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build, e.g. v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed for the "Full diff" link

      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "${{ github.event.inputs.version || github.ref_name }}" > "$RUNNER_TEMP/notes.md"

      - name: Build app
        env:
          AERIS_CLIENT_ID: ${{ secrets.AERIS_CLIENT_ID }}
          AERIS_CLIENT_SECRET: ${{ secrets.AERIS_CLIENT_SECRET }}
        run: scripts/build-app.sh "${{ github.event.inputs.version || github.ref_name }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/*.zip --title "Aeris $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
